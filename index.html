// Renderer SVG
function render(){let out=`<rect x="-5" y="-5" width="${W*S+10}" height="${H*S+10}" rx="10" fill="var(--board)"/>`;for(let y=0;y<H;y++)for(let x=0;x<W;x++)out+=`<rect x="${x*S+1}" y="${y*S+1}" width="48" height="48" rx="4" fill="var(--cell)"/>`;for(const g of gates){let v=g.side==='top'||g.side==='bottom',x=v?g.start*S:g.side==='left'?-29:W*S,y=v?(g.side==='top'?-29:H*S):g.start*S,w=v?g.len*S:29,h=v?29:g.len*S;out+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="${palette[g.c][0]}" stroke="${palette[g.c][1]}" stroke-width="1.5"/><text x="${x+w/2}" y="${y+h/2+7}" text-anchor="middle" font-size="23" font-weight="bold" fill="white">${{top:'↑',bottom:'↓',left:'←',right:'→'}[g.side]}</text>`}
for(const p of pieces){let [c,d]=palette[p.c],w=p.w*S-3,h=p.h*S-3;if(p.cells.length!==p.w*p.h){const [fx,fy]=p.cells[0];out+=`<g class="piece" data-id="${p.id}" transform="translate(${p.x*S} ${p.y*S})">${p.cells.map(([u,v])=>`<rect x="${u*S+1}" y="${v*S+1}" width="${S-2}" height="${S-2}" rx="7" fill="${c}" stroke="${d}"/>`).join("")}<g transform="translate(${fx*S+25} ${fy*S+25})"><ellipse cx="-9" cy="-5" rx="7" ry="9" fill="white"/><ellipse cx="9" cy="-5" rx="7" ry="9" fill="white"/><circle cx="-7" cy="-4" r="4"/><circle cx="11" cy="-4" r="4"/><path d="M-8 7 Q0 20 8 7 Z" fill="var(--mouth)"/></g></g>`;continue;}out+=`<g class="piece" data-id="${p.id}" transform="translate(${p.x*S+1.5} ${p.y*S+1.5})"><rect width="${w}" height="${h}" rx="9" fill="${d}"/><rect width="${w}" height="${h-4}" rx="9" fill="${c}" stroke="${d}" stroke-width="1.4"/><path d="M8 13 Q8 6 16 6 H${w-10}" stroke="white" stroke-opacity=".8" stroke-width="3" fill="none" stroke-linecap="round"/><g transform="translate(${w/2} ${h/2-2})"><ellipse cx="-9" cy="-5" rx="7" ry="9" fill="white"/><ellipse cx="9" cy="-5" rx="7" ry="9" fill="white"/><ellipse cx="-7" cy="-4" rx="4" ry="6" fill="var(--pupil)"/><ellipse cx="11" cy="-4" rx="4" ry="6" fill="var(--pupil)"/><circle cx="-6" cy="-6" r="1.5" fill="white"/><circle cx="12" cy="-6" r="1.5" fill="white"/><path d="M-8 7 Q0 20 8 7 Z" fill="var(--mouth)"/><path d="M-4 12 Q0 9 4 12 Q0 16 -4 12" fill="var(--tongue)"/></g></g>`}svg.innerHTML=out;movesEl.textContent=moves;remaining.textContent=pieces.length;undo.disabled=!history.length||!!drag;const next=document.querySelector("#next");next.hidden=pieces.length!==0||!!drag||levelIndex===LEVELS.length-1;}
function resizeBoard(){svg.setAttribute("viewBox",`-32 -32 ${W*S+64} ${H*S+64}`);svg.parentElement.style.aspectRatio=`${W*S+64}/${H*S+64}`;svg.setAttribute("aria-label",`Tabellone ${W} colonne per ${H} righe`);}
function loadLevel(index){if(drag||index<0||index>=LEVELS.length)return;level=normalizeLevel(LEVELS[index]);levelIndex=index;W=level.width;H=level.height;initial=level.blocks;gates=level.gates;document.querySelector('#heading').textContent=`6 Blocks · Livello ${level.id}${index>0?' (provvisorio)':''}`;resizeBoard();reset();}
document.querySelector('#next').onclick=()=>{if(!drag&&!pieces.length)loadLevel(levelIndex+1)};
resizeBoard();
// Input e transazioni
function point(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
svg.addEventListener('pointerdown',e=>{if(drag||e.button!==0)return;let el=e.target.closest('[data-id]');if(!el)return;let p=pieces.find(p=>p.id===+el.dataset.id),a=point(e);drag={id:p.id,a,baseX:p.x,baseY:p.y,snapshot:clone(pieces),changed:false,removed:false};svg.setPointerCapture(e.pointerId);drag.pointer=e.pointerId;undo.disabled=true;e.preventDefault()});
svg.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointer||drag.removed)return;const p=pieces.find(p=>p.id===drag.id),a=point(e);let tx=drag.baseX+Math.round((a.x-drag.a.x)/S),ty=drag.baseY+Math.round((a.y-drag.a.y)/S);for(let i=0;i<20;i++){let dx=tx-p.x,dy=ty-p.y;if(!dx&&!dy)break;let dirs=Math.abs(dx)>=Math.abs(dy)?[[Math.sign(dx),0],[0,Math.sign(dy)]]:[[0,Math.sign(dy)],[Math.sign(dx),0]];let ok=false;for(let [u,v] of dirs){if(!u&&!v)continue;if(fits(p,p.x+u,p.y+v)){p.x+=u;p.y+=v;ok=true;drag.changed=true;break}if(exit(p,u,v)){pieces=pieces.filter(q=>q.id!==p.id);drag.removed=true;drag.changed=true;ok=true;msg.textContent='Blocco liberato!';break}}if(!ok||drag.removed)break}render()});
function finish(e,cancel){if(!drag||e.pointerId!==drag.pointer)return;let d=drag;drag=null;if(cancel){pieces=d.snapshot;msg.textContent='Movimento annullato.'}else if(d.removed||pieces.some(p=>p.id===d.id&&(p.x!==d.baseX||p.y!==d.baseY))){history.push(d.snapshot);moves++;if(!d.removed)msg.textContent='Continua così!'}if(!pieces.length)msg.textContent='🎉 Livello completato in '+moves+' mosse!'+(levelIndex===LEVELS.length-1?' Fine degli schemi provvisori.':'');render()}
svg.addEventListener('pointerup',e=>finish(e,false));svg.addEventListener('pointercancel',e=>finish(e,true));svg.addEventListener('lostpointercapture',e=>finish(e,true));
function reset(){drag=null;pieces=clone(initial);moves=0;history=[];msg.textContent='Trascina un blocco oltre il bordo della sua uscita.';render()}document.querySelector('#reset').onclick=reset;undo.onclick=()=>{if(drag||!history.length)return;pieces=history.pop();moves--;msg.textContent='Ultima mossa annullata.';render()};reset();document.querySelector("#reset").disabled=false;
</script></html>
